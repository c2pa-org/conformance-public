include:
  - globals-actions.yml
  - globals-manifest.yml

expressions:
  # Zero-arg wrappers for conformance context (root = full crJSON).
  # Each binds manifests[0] (via _activeManifest()) as the active manifest and delegates to the
  # parameterized base in globals-manifest.yml — composable call sites unchanged.
  _activeManifest:          "manifests[0]"
  _validationResults:       "_manifest_validationResults(_activeManifest())"
  _assertionKeys:           "_manifest_assertionKeys(_activeManifest())"
  _assertionValues:         "_manifest_assertionValues(_activeManifest())"
  _actionsV2:               "_manifest_actionsV2(_activeManifest())"
  _actionsV2Assertion:      "_manifest_actionsV2Assertion(_activeManifest())"
  _claimV2:                 "_manifest_claimV2(_activeManifest())"
  _createdAssertions:       "_manifest_createdAssertions(_activeManifest())"
  _ingredientAssertions:    "_manifest_ingredientAssertions(_activeManifest())"

  # $args[0] = prefix list (arg 0), $args[1] = string to test (arg 1).
  # Argument order is intentional: $args is a global array and is NOT shadowed inside [?...],
  # so startsWith($args[1], @) correctly tests the string against each prefix element.
  # Call as: _startsWithAny(prefixList, stringToTest)
  _startsWithAny:           "length($args[0][? startsWith($args[1], @)]) > 0"
