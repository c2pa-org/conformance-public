rubric_metadata:
  name: "Perceptible Non-GenAI Transformations (Local)"
  issuer: "C2PA Conformance Task Force"
  date: "2026-03-30T16:38:41-07:00"
  version: "1.1.0"
  language: "en"

include:
  - globals-signals.yml

---

- id: "signal_perceptibleNonGenAI"
  description: "Check if the manifest contains a Perceptible Non-GenAI Transformations signal"
  expression: |
    length(_signalActions()[? action != null &&
      !contains($inception_actions, action) &&
      !contains($non_editorial_actions, action) &&
      digitalSourceType != null &&
      !contains($genai_dst_types, digitalSourceType)]) > 0
  reportText:
    "true":
      en: "Contains Perceptible Non-GenAI Transformations"
    "false":
      en: "Does not contain Perceptible Non-GenAI Transformations"
